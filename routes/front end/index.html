<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earth Buddy | Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-overlay"></div>

  <main class="container">
    <header class="brand-header">
      <img src="images/earth buddy logo2.png" alt="Earth Buddy Logo" class="logo" />
      <div>
        <h1>Earth Buddy</h1>
        <p>Be the Buddy Earth Needs</p>
      </div>
    </header>

    <section class="auth-card">
      <div class="auth-tabs">
        <button class="tab-btn active" id="loginTab">Login</button>
        <button class="tab-btn" id="registerTab">Register</button>
      </div>

      <form id="loginForm" class="auth-form">
        <h2>Welcome Back</h2>
        <div class="input-group">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" placeholder="Enter username" required />
        </div>

        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password" required />
        </div>

        <button type="submit" class="primary-btn">Login</button>
        <p id="loginMessage" class="message"></p>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <h2>Create Account</h2>
        <div class="input-group">
          <label for="registerName">Name</label>
          <input type="text" id="registerName" placeholder="Enter your name" required />
        </div>

        <div class="input-group">
          <label for="registerUsername">Username</label>
          <input type="text" id="registerUsername" placeholder="Choose a username" required />
        </div>

        <div class="input-group">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" placeholder="Create a password" required />
        </div>

        <button type="submit" class="primary-btn">Register</button>
        <p id="registerMessage" class="message"></p>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
